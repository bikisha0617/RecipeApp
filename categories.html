<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories</title>
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/categories.css">
</head>
<body>

<!-- Navbar -->

<header class="navbar">
    <div class="logo">
        <img src="images/logo.png" alt="">
    </div>

    <nav class="nav-links">
        <a href="index.html">Explore</a>
        <a href="#">My Recipes</a>
        <a href="categories.html">Categories</a>
        <a href="create.html">Create</a>
    </nav>

    <div class="search-bar">
        <img src="images/icons/search.png">
        <input type="text" placeholder="Search recipes">
    </div>

    <div class="account-section">
        <div class="profile-section" style="display:flex;">
            <img src="images/icons/profile.png" class="profile-pic">
            <button class="dropdown-btn">
                <img src="images/icons/dropdown.png">
            </button>
        </div>
    </div>
</header>

<!-- Main -->
<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">
        <a href="index.html">
            <img src="images/icons/recipe.png">Recipes
        </a>

        <a href="#">
            <img src="images/icons/favourite.png">Favourites
        </a>

        <a href="#">
            <img src="images/icons/healthy.png">Healthy
        </a>

        <a href="#">
            <img src="images/icons/dessert.png">Dessert
        </a>

        <div class="settings">
            <a href="settings.html">
                <img src="images/icons/settings.png">
            </a>
        </div>
    </aside>

    <!-- Categories -->
    <main class="categories">
        <h1>Categories</h1>
        <div class="category-grid">
            <a href="#" class="category-card">
                <img src="images/categories/breakfast.jpg">
                <span>Breakfast</span>
            </a>
            <a href="#" class="category-card">
                <img src="images/categories/lunch.jpg">
                <span>Lunch</span>
            </a>
            <a href="#" class="category-card">
                <img src="images/categories/dinner.jpg">
                <span>Dinner</span>
            </a>
            <a href="#" class="category-card">
                <img src="images/categories/dessert.jpg">
                <span>Dessert</span>
            </a>
            <a href="#" class="category-card">
                <img src="images/categories/healthy.jpg">
                <span>Healthy</span>
            </a>
            <a href="#" class="category-card">
                <img src="images/categories/snacks.jpg">
                <span>Snacks</span>
            </a>
            <a href="#" class="category-card">
                <img src="images/categories/drinks.jpg">
                <span>Drinks</span>
            </a>
            <a href="#" class="category-card">
                <img src="images/categories/vegan.jpg">
                <span>Vegan</span>
            </a>
        </div>
    </main>
</div>

<script src="js/categories.js"></script>
</body>
</html>
