<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"content="width=device-width, initial-scale=1.0">
    <title>Edit Recipe</title>
    <link rel="stylesheet" href="css/home.css">
    <style>
        .edit-container {
            max-width: 850px;
            margin: 40px auto;
            padding: 30px;
        }

        .edit-container h1 {
            margin-bottom: 25px;
        }

        .edit-form {
            background: #ffefe4;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group input,.form-group textarea,.form-group select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .array-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .array-row input {
            flex: 1;
        }

        .remove-item {
            border: none;
            background: #7D0633;
            color: #ffede0;
            padding: 0 14px;
            border-radius: 7px;
            cursor: pointer;
        }

        .add-item {
            padding: 9px 14px;
            border-radius: 7px;
            cursor: pointer;
            background: #eee;
            margin-bottom: 15px;
            border: 1px solid #31112C;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .save-btn,.cancel-btn {
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .save-btn {
            background: #31112C;
            color: white;
        }

        .cancel-btn {
            background: #eee;
            color: #31112C;
            border: 1px solid #31112C;
        }

        .message {
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .message.error {
            display: block;
            background: #ffe5e5;
            color: #a00000;
        }

        .message.success {
            display: block;
            background: #e5f7e8;
            color: #176b28;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .current-image {
            max-width: 250px;
            max-height: 200px;
            display: block;
            margin-top: 10px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<header class="navbar">
    <div class="logo">
        <img src="images/logo.png" alt="Logo">
    </div>
    <nav class="nav-links">
        <a href="index.html">Explore</a>
        <a href="myrecipes.html">My Recipes</a>
        <a href="create.html">Create</a>
        <a href="favourites.html">Favourites</a>
    </nav>
    <div class="account-section">
        <button id="loginBtn" type="button" onclick="window.location.href='login.html'">Login</button>
    </div>
</header>

<main class="edit-container">
    <h1>Edit Recipe</h1>
    <div id="message" class="message"></div>
    <div id="loading" class="loading">Loading recipe...</div>
    <form id="editForm" class="edit-form" style="display:none;">
        <div class="form-group">
            <label for="title">Recipe Title</label>
            <input type="text" id="title" required>
        </div>

        <div class="form-group">
            <label for="description"> Description </label>
            <textarea id="description" required></textarea>
        </div>
        <div class="form-group">
            <label for="category">Category</label>
            <input type="text" id="category">
        </div>
        <div class="form-group">
            <label for="time">Cooking Time</label>
            <input type="text" id="time" required>
        </div>
        <div class="form-group">
            <label for="servings">Servings</label>
            <input type="text" id="servings" required>
        </div>
        <div class="form-group">
            <label for="difficulty">Difficulty</label>
            <select id="difficulty">
                <option value="Easy">Easy</option>
                <option value="Medium">Medium</option>
                <option value="Hard">Hard</option>
            </select>
        </div>
        <div class="form-group">
            <label>Current Image</label>
            <img id="currentImage" class="current-image" alt="Current recipe image">
        </div>
        <div class="form-group">
            <label for="calories">Calories</label>
            <input type="number" id="calories" min="0">
        </div>
        <div class="form-group">
            <label for="protein">Protein</label>
            <input type="number" id="protein" min="0">
        </div>
        <div class="form-group">
            <label for="carbs">Carbohydrates</label>
            <input type="number" id="carbs" min="0">
        </div>
        <div class="form-group">
            <label for="fat">Fat</label>
            <input type="number" id="fat" min="0">
        </div>
        <div class="form-group">
            <label>Ingredients</label>
            <div id="ingredients"></div>
            <button type="button" class="add-item" id="addIngredient">+ Add Ingredient</button>
        </div>
        <div class="form-group">
            <label>Instructions</label>
            <div id="instructions"></div>
            <button type="button" class="add-item" id="addInstruction">+ Add Instruction</button>
        </div>
        <div class="form-actions">
            <button type="submit" class="save-btn" id="saveBtn">Save Changes</button>
            <button type="button" class="cancel-btn" onclick="window.location.href='myrecipes.html'">Cancel</button>
        </div>
    </form>
</main>

<script src="js/api.js"></script>
<script src="js/edit.js"></script>
</body>
</html>
