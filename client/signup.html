<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="css/signup.css">
</head>
<body>
    <main class="signup-page">
        <div class="signup-container">
            <h1> Create Account </h1>
            <p class="signup-subtitle"> Create an account to save and publish recipes. </p>
            <!-- SIGNUP FORM -->
            <form id="signupForm">
                <div class="form-group">
                    <label for="name"> Name </label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" autocomplete="name" minlength="2" required>
                </div>
                <div class="form-group">
                    <label for="email"> Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="password"> Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="new-password" minlength="6" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword"> Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" autocomplete="new-password" minlength="6" required>
                </div>

                <button type="submit" id="signupBtn"> Create Account </button>
            </form>
            <p class="login-link">
                Already have an account?
                <a href="login.html">Login </a>
            </p>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/signup.js"></script>
</body>
</html>
