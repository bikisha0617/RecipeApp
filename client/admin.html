<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>

    <style>
        body{
            font-family: Arial;
            margin:20px;
        }

        h1{
            margin-bottom:20px;
        }

        .stats{
            display:flex;
            gap:20px;
            margin-bottom:30px;
        }

        .card{
            border:1px solid #ddd;
            padding:20px;
            width:180px;
            border-radius:8px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-bottom:40px;
        }

        th,td{
            border:1px solid #ddd;
            padding:10px;
            text-align:left;
        }

        button{
            padding:6px 12px;
            cursor:pointer;
        }

        .delete{
            background:red;
            color:white;
            border:none;
        }
    </style>
</head>

<body>

    <h1>Admin Dashboard</h1>

    <div class="stats">

        <div class="card">
            <h3>Users</h3>
            <p id="usersCount">0</p>
        </div>

        <div class="card">
            <h3>Recipes</h3>
            <p id="recipesCount">0</p>
        </div>

        <div class="card">
            <h3>Favourites</h3>
            <p id="favouritesCount">0</p>
        </div>

    </div>

    <h2>Users</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="usersTable"></tbody>
    </table>

    <h2>Recipes</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="recipesTable"></tbody>
    </table>

    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>

</body>
</html>
