<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe App</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/home.css">
</head>
<body>

    <!-- Navbar -->

    <header class="navbar">
        <div class="logo">
            <img src="images/logo.png" alt="Logo">
        </div>

        <nav class="nav-links">
            <a href="#">Explore</a>
            <a href="#">My Recipes</a>
            <a href="categories.html">Categories</a>
            <a href="create.html">Create</a>
        </nav>

        <div class="search-bar">
            <img src="images/icons/search.png" alt="">
            <input
                type="text"
                placeholder="Search recipes"
                id="searchInput"
            >
        </div>

        <div class="account-section">
            <button id="loginBtn">
                Login
            </button>

            <button id="dropdownBtn" class="dropdown-btn">
                <img src="images/icons/dropdown.png" alt="">
            </button>

            <div id="dropdownMenu" class="dropdown-menu">
                <div class="dropdown-item login-item">
                    Login
                </div>
            </div>
        </div>
    </header>

    <!-- Main -->

    <main class="container">

        <!-- Sidebar -->

        <aside class="sidebar">
            <a href="#">
                <img src="images/icons/recipe.png">
                Recipes
            </a>

            <a href="#">
                <img src="images/icons/favourite.png">
                Favourites
            </a>

            <a href="#">
                <img src="images/icons/healthy.png">
                Healthy
            </a>

            <a href="#">
                <img src="images/icons/dessert.png">
                Dessert
            </a>

            <div class="settings">
                <a href="settings.html">
                    <img src="images/icons/settings.png">
                </a>
            </div>

        </aside>

        <!-- Recipes -->

        <section class="recipes-grid" id="recipeContainer">
        </section>
    </main>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
