<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe App</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/home.css">
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="logo">
            <img src="images/logo.png" alt="Logo">
        </div>

        <nav class="nav-links">
            <a href="index.html">Explore</a>
            <a href="myrecipes.html">My Recipes</a>
            <a href="categories.html">Categories</a>
            <a href="create.html">Create</a>
        </nav>

        <div class="search-bar">
            <img src="images/icons/search.png" alt="Search">
            <input type="text" placeholder="Search recipes" id="searchInput">
        </div>

        <div class="account-section">

            <!-- Guest -->
            <button id="loginBtn">Login</button>

            <!-- Logged In -->
            <div id="profileSection" class="profile-section">
                <img src="images/icons/profile.png" class="profile-pic" alt="Profile">
                <button id="dropdownBtn" class="dropdown-btn">
                    <img src="images/icons/dropdown.png" alt="Dropdown">
                </button>
            </div>

            <!-- Dropdown -->
            <div id="dropdownMenu" class="dropdown-menu">
                <div class="dropdown-user">
                    <img src="images/icons/profile.png" class="dropdown-profile" alt="Profile">
                    <div>
                        <h4>Bikisha Maharjan</h4>
                        <small>bikisha@gmail.com</small>
                    </div>
                </div>
                <hr>
                <div class="dropdown-item" id="switchAccount">
                    Add another account
                </div>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="container">

        <!-- Sidebar -->
        <aside class="sidebar">
            <a href="#">
                <img src="images/icons/recipe.png" alt="Recipes">Recipes
            </a>

            <a href="#">
                <img src="images/icons/favourite.png" alt="Favourites">Favourites
            </a>

            <a href="#">
                <img src="images/icons/healthy.png" alt="Healthy">Healthy
            </a>

            <a href="#">
                <img src="images/icons/dessert.png" alt="Dessert">Dessert
            </a>

            <div class="settings">
                <a href="settings.html">
                    <img src="images/icons/settings.png" alt="Settings">
                </a>
            </div>
        </aside>

        <!-- Recipes -->
        <section class="recipes-grid" id="recipeContainer">
        </section>
    </main>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
