<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/profile.css">
</head>
<body>

<header class="navbar">
    <div class="logo">
        <img src="images/logo.png" alt="Logo">
    </div>

    <nav class="nav-links">
        <a href="index.html">Explore</a>
        <a href="myrecipes.html">My Recipes</a>
        <a href="categories.html">Categories</a>
        <a href="create.html">Create</a>
    </nav>

    <div class="search-bar">
        <img src="images/icons/search.png">
        <input type="text" placeholder="Search recipes">
    </div>

    <div class="account-section">
        <div class="profile-section" style="display:flex">
            <a href="profile.html"><img src="images/icons/profile.png" class="profile-pic" alt="Profile"></a>
            <button class="dropdown-btn">
                <img src="images/icons/dropdown.png">
            </button>
        </div>
    </div>
</header>
<div class="container">
    <aside class="sidebar">
        <a href="index.html">
            <img src="images/icons/recipe.png">Recipes
        </a>
        <a href="myrecipes.html">
            <img src="images/icons/favourite.png">My Recipes
        </a>
        <a href="categories.html">
            <img src="images/icons/healthy.png">Categories
        </a>
        <a href="create.html">
            <img src="images/icons/dessert.png">Create
        </a>

        <div class="settings">
            <a href="settings.html">
                <img src="images/icons/settings.png">
            </a>
        </div>
    </aside>

    <main class="profile-page">
        <!-- Cover -->
        <div class="profile-banner">
            <div class="profile-header">
                <img src="images/icons/profile.png" class="profile-picture">
                <div class="profile-info">
                    <h1 id="profileName">Bikisha Maharjan</h1>
                    <p id="profileEmail">bikisha@email.com</p>
                    <p class="bio">Eat.</p>
                </div>
                <a href="settings.html" class="edit-profile">Edit Profile</a>
            </div>

            <div class="stats">
                <div>
                    <h2 id="recipeCount">0</h2>
                    <p>Recipes</p>
                </div>
                <div>
                    <h2 id="savedCount">0</h2>
                    <p>Favourites</p>
                </div>
                <div>
                    <h2 id="favCount">0</h2>
                    <p>Likes</p>
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" data-tab="recipes">
                Recipes
            </button>
            <button class="tab" data-tab="saved">
                Favourites
            </button>
        </div>

        <!-- Recipes -->
        <div id="recipesTab" class="tab-content active">
            <div id="profileRecipeGrid" class="recipe-grid"></div>
        </div>

        <!-- Favourites -->
        <div id="savedTab" class="tab-content">
            <div id="savedGrid" class="recipe-grid"></div>
        </div>
    </main>
</div>

<script src="js/data.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
